<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Еженедельный отчёт · Руководство — прототип</title>
<style>
  :root{
    --bg:#f2efe7;
    --surface:#ffffff;
    --surface-2:#faf8f2;
    --ink:#1b1e1a;
    --ink-soft:#3c403a;
    --muted:#6d7268;
    --faint:#9aa096;
    --line:#e3ddd0;
    --line-strong:#cfc7b6;
    --accent:#0e7a58;
    --accent-deep:#0a5c42;
    --accent-soft:#e2efe8;
    --accent-ink:#0a5c42;
    --warn:#b95a1f;
    --mono:"Cascadia Mono","Consolas","SF Mono",ui-monospace,monospace;
    --sans:"Segoe UI","Helvetica Neue",system-ui,sans-serif;
    --shadow:0 1px 2px rgba(27,30,26,.05),0 8px 24px rgba(27,30,26,.06);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--sans);color:var(--ink);
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(14,122,88,.08), transparent 60%),
      radial-gradient(900px 400px at -10% 0%, rgba(185,90,31,.06), transparent 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    padding:28px clamp(16px,4vw,56px) 60px;
  }

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;margin-bottom:8px}
  h1{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .subtitle{color:var(--muted);font-size:14px;margin-top:8px}
  .scope{text-align:right;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow)}
  .scope b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink);margin-top:2px}
  .scope .lbl{letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:var(--faint)}

  .controls{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;margin-bottom:20px;
    display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
  }
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .field select{
    font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--surface-2);
    border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;outline:none;cursor:pointer;
    transition:border-color .15s,box-shadow .15s;
  }
  .field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:7px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:9px;max-width:520px}
  .chip{font-size:12.5px;padding:5px 10px;border-radius:999px;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);user-select:none;transition:all .15s}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chip.off{opacity:.4}
  .chip.dim{opacity:.25;pointer-events:none}

  .matrix-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .matrix-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .matrix-head h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .matrix-head .hint{font-size:12px;color:var(--faint)}
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:820px}
  th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--line)}
  th{
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    font-weight:700;background:var(--surface-2);white-space:nowrap;vertical-align:bottom;
  }
  th.rowhead,td.rowhead{text-align:left}
  td.rowhead{font-weight:600;font-size:13.5px;color:var(--ink-soft);white-space:nowrap}
  td.rowhead .dept{display:block;font-weight:400;font-size:10.5px;color:var(--faint)}
  td.cell{font-family:var(--mono);font-size:14px;font-weight:600}
  td.cell .sum{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}
  td.cell.zero{color:var(--faint);font-weight:400}
  td.total{font-family:var(--mono);font-weight:700;background:var(--accent-soft);color:var(--accent-ink)}
  td.total .sum{display:block;font-size:10.5px;color:var(--accent-ink);opacity:.75;margin-top:2px}
  tr.grand td{background:var(--ink);color:#fff;font-family:var(--mono);font-weight:700;border-bottom:none}
  tr.grand td.rowhead{color:#fff}
  tr.grand td .sum{color:#cfe6dc}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:opacity .2s,transform .2s}
  tbody tr.hidden{display:none}
  .empty{padding:40px;text-align:center;color:var(--faint);font-size:14px}

  .foot{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint)}
  .foot .demo{color:var(--warn);font-weight:600;letter-spacing:.04em}

  @media (max-width:640px){.scope{text-align:left}.topbar{align-items:flex-start}}
</style>
</head>
<body>

  <header class="topbar">
    <div>
      <div class="eyebrow">Аналитические отчёты · Сделки</div>
      <h1>Еженедельный отчёт — Руководство</h1>
      <div class="subtitle">Распределение сделок по стадиям · сгруппировано по сотрудникам · снимок на конец недели</div>
    </div>
    <div class="scope">
      <span class="lbl">Точка среза</span>
      <b id="cutoffDate">—</b>
    </div>
  </header>

  <section class="controls">
    <div class="field">
      <label for="week">Период</label>
      <select id="week"></select>
    </div>
    <div class="field">
      <label>Отделы</label>
      <div class="chips" id="depts"></div>
    </div>
    <div class="field">
      <label>Сотрудники</label>
      <div class="chips" id="emps"></div>
    </div>
    <div class="field">
      <label>Воронки</label>
      <div class="chips" id="funnels"></div>
    </div>
  </section>

  <section class="matrix-wrap">
    <div class="matrix-head">
      <h2>Матрица «Сотрудники × Виртуальные стадии»</h2>
      <span class="hint">ячейка — количество сделок · срез на конец недели</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="foot">
      <span>Прототип интерфейса · <span class="demo">демо-данные</span></span>
      <span id="footNote"></span>
    </div>
  </section>

<script>
  // ---------- Демо-данные ----------
  const DEPARTMENTS = ["Коммерческая Служба","Отдел развития"];
  const EMPLOYEES = [
    {name:"Анна Соколова", dept:"Коммерческая Служба"},
    {name:"Дмитрий Ковалёв", dept:"Коммерческая Служба"},
    {name:"Мария Лебедева", dept:"Коммерческая Служба"},
    {name:"Игорь Петров", dept:"Отдел развития"},
    {name:"Ольга Смирнова", dept:"Отдел развития"}
  ];
  const FUNNELS = ["Обследование","Продажа ПО","Поддержка","Обучение"];
  const STAGES = ["Подготовка КП","Согласование договора","Подписание","Заключено","Передано в работу"];
  const WEEKS = [
    {id:"w0", label:"Текущая неделя", monday:"2026-10-05"},
    {id:"w1", label:"Прошлая неделя", monday:"2026-09-28"},
    {id:"w2", label:"Позапрошлая неделя", monday:"2026-09-21"}
  ];

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

  // data[emp][week][funnel][stage] = count
  const data = {};
  EMPLOYEES.forEach((emp,ei)=>{
    data[emp.name]={};
    WEEKS.forEach((wk,wi)=>{
      data[emp.name][wk.id]={};
      const rnd=mulberry32(hashStr(emp.name+wk.id));
      FUNNELS.forEach((fn,fi)=>{
        data[emp.name][wk.id][fn]={};
        STAGES.forEach((st,si)=>{
          let base = 1 + Math.floor(rnd()*4);
          if(si>=3) base = 1 + Math.floor(rnd()*3);
          // у части сотрудников на части недель сделок нет
          if(rnd()<0.12) base = 0;
          const sum = base * Math.round((200000 + rnd()*800000)/1000)*1000;
          data[emp.name][wk.id][fn][st]={count:base, sum};
        });
      });
    });
  });

  const state = { week:WEEKS[0].id, depts:new Set(DEPARTMENTS), emps:new Set(EMPLOYEES.map(e=>e.name)), funnels:new Set(FUNNELS) };

  const $week=document.getElementById("week");
  const $depts=document.getElementById("depts");
  const $emps=document.getElementById("emps");
  const $funnels=document.getElementById("funnels");
  const $thead=document.getElementById("thead");
  const $tbody=document.getElementById("tbody");
  const $cutoff=document.getElementById("cutoffDate");
  const $foot=document.getElementById("footNote");

  function fmt(n){return n.toLocaleString("ru-RU");}
  function fmtMoney(n){return fmt(n)+" ₽";}

  function cutoffDate(){
    const wk=WEEKS.find(w=>w.id===state.week);
    const d=new Date(wk.monday+"T00:00:00");
    d.setDate(d.getDate()+4);
    return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
  }

  // сотрудники, у которых есть сделки на срез (по выбранным воронкам)
  function activeEmps(){
    return EMPLOYEES.filter(e=>{
      if(!state.depts.has(e.dept)) return false;
      let sum=0;
      FUNNELS.forEach(fn=>{
        if(!state.funnels.has(fn)) return;
        STAGES.forEach(st=>{ sum += data[e.name][state.week][fn][st].count; });
      });
      return sum>0;
    }).map(e=>e.name);
  }

  function initControls(){
    WEEKS.forEach(w=>{const o=document.createElement("option");o.value=w.id;o.textContent=w.label;$week.appendChild(o);});
    DEPARTMENTS.forEach(d=>{
      const c=document.createElement("span");c.className="chip on";c.textContent=d;c.dataset.d=d;
      c.addEventListener("click",()=>{
        if(state.depts.has(d)){state.depts.delete(d);c.classList.remove("on");c.classList.add("off");}
        else{state.depts.add(d);c.classList.add("on");c.classList.remove("off");}
        render();
      });
      $depts.appendChild(c);
    });
    FUNNELS.forEach(fn=>{
      const c=document.createElement("span");c.className="chip on";c.textContent=fn;c.dataset.fn=fn;
      c.addEventListener("click",()=>{
        if(state.funnels.has(fn)){state.funnels.delete(fn);c.classList.remove("on");c.classList.add("off");}
        else{state.funnels.add(fn);c.classList.add("on");c.classList.remove("off");}
        render();
      });
      $funnels.appendChild(c);
    });
    $week.addEventListener("change",()=>{state.week=$week.value;render();});
  }

  function render(){
    $cutoff.textContent=cutoffDate();
    const active=activeEmps();

    // перестроить чипы сотрудников: только активные на срез
    $emps.innerHTML="";
    EMPLOYEES.forEach(e=>{
      const isActive=active.includes(e.name);
      const c=document.createElement("span");
      c.className="chip "+(state.emps.has(e.name)?"on":"off")+(isActive?"":" dim");
      c.textContent=e.name;c.dataset.emp=e.name;
      if(isActive){
        c.addEventListener("click",()=>{
          if(state.emps.has(e.name)){state.emps.delete(e.name);c.classList.remove("on");c.classList.add("off");}
          else{state.emps.add(e.name);c.classList.add("on");c.classList.remove("off");}
          render();
        });
      }
      $emps.appendChild(c);
    });

    const selectedEmps=active.filter(n=>state.emps.has(n));
    $thead.innerHTML=`<tr><th class="rowhead">Сотрудник</th>${STAGES.map(s=>`<th>${s}</th>`).join("")}<th>Итог по сотруднику</th></tr>`;

    if(selectedEmps.length===0){
      $tbody.innerHTML=`<tr><td colspan="7"><div class="empty">Нет сотрудников со сделками на выбранный срез</div></td></tr>`;
      $foot.textContent=`${WEEKS.find(w=>w.id===state.week).label}`;
      return;
    }

    // сводные по стадиям
    const stageTotals=STAGES.map((st,si)=>{
      let c=0,s=0;
      selectedEmps.forEach(n=>{
        FUNNELS.forEach(fn=>{ if(state.funnels.has(fn)){ c+=data[n][state.week][fn][st].count; s+=data[n][state.week][fn][st].sum; } });
      });
      return {c,s};
    });
    let grandC=0,grandS=0; stageTotals.forEach(t=>{grandC+=t.c;grandS+=t.s;});

    let rows="";
    selectedEmps.forEach(n=>{
      const emp=EMPLOYEES.find(e=>e.name===n);
      let rowC=0,rowS=0;
      const cells=STAGES.map((st,si)=>{
        let c=0,s=0;
        FUNNELS.forEach(fn=>{ if(state.funnels.has(fn)){ c+=data[n][state.week][fn][st].count; s+=data[n][state.week][fn][st].sum; } });
        rowC+=c;rowS+=s;
        return `<td class="cell ${c===0?"zero":""}">${c}<span class="sum">${fmtMoney(s)}</span></td>`;
      }).join("");
      rows+=`<tr><td class="rowhead">${n}<span class="dept">${emp.dept}</span></td>${cells}<td class="total">${fmt(rowC)}<span class="sum">${fmtMoney(rowS)}</span></td></tr>`;
    });

    rows+=`<tr><td class="rowhead">Итог по стадиям</td>${stageTotals.map(t=>`<td class="total">${fmt(t.c)}<span class="sum">${fmtMoney(t.s)}</span></td>`).join("")}<td class="total">${fmt(grandC)}<span class="sum">${fmtMoney(grandS)}</span></td></tr>`;
    rows+=`<tr class="grand"><td class="rowhead">Итого по службе</td>${STAGES.map(()=>`<td></td>`).join("")}<td class="total">${fmt(grandC)}<span class="sum">${fmtMoney(grandS)}</span></td></tr>`;

    $tbody.innerHTML=rows;
    $foot.textContent=`${WEEKS.find(w=>w.id===state.week).label} · ${selectedEmps.length} сотрудников`;
  }

  initControls();
  render();
</script>
</body>
</html>
