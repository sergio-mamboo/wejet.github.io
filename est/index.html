<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рабочее место РП</title>
<style>
:root{
  --bg:#eef2f4;--panel:#fff;--ink:#1f2933;--muted:#6b7785;--line:#dde3e8;
  --accent:#0b66c3;--accent-soft:#e6f0fb;--ok:#2e9e4f;--ok-soft:#e5f5ea;
  --warn:#c77800;--warn-soft:#fff3dc;--bad:#c62f2f;--bad-soft:#fde8e8;
  --src-sp:#0b66c3;--src-1c:#b58400;--src-calc:#2e9e4f;--src-ai:#7a4fd1;
  --side:#1d2b3a;--side-ink:#c9d4df;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
.app{display:flex;min-height:100vh}
.side{width:232px;flex:none;background:var(--side);color:var(--side-ink);padding:14px 0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 18px 14px;font-weight:700;color:#fff;font-size:15px}
.brand small{display:block;font-weight:400;color:#8fa3b7;font-size:12px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 18px;color:var(--side-ink);font-size:14px}
.nav a:hover{background:#26384b;text-decoration:none}
.nav a.on{background:#2d4359;color:#fff;border-left:3px solid #4fb3ff;padding-left:15px}
.nav .grp{padding:14px 18px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7f93a8}
.nav .tag{font-size:10px;background:#3b5168;border-radius:8px;padding:1px 6px;color:#c9d4df}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;max-width:100%}
.top .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toggle{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;user-select:none;padding:6px 10px;border:1px solid var(--line);border-radius:16px}
.toggle.on{background:var(--accent-soft);border-color:#9cc3ec}
.btn{font:inherit;border:0;border-radius:16px;padding:7px 14px;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid #9cc3ec}
.who{font-size:13px;color:var(--muted)}
.content{padding:20px 22px 60px;max-width:1280px;width:100%}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;position:relative;background:#fbfcfd}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:650;margin-top:2px;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.src{display:none;margin-top:6px;font-size:11px;line-height:1.3;border-top:1px dashed var(--line);padding-top:5px;color:var(--muted)}
.trace .src{display:block}
.st{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:4px;color:#fff;vertical-align:1px}
.st.sp{background:var(--src-sp)}.st.c1{background:var(--src-1c)}.st.calc{background:var(--src-calc)}.st.ai{background:var(--src-ai)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:6px 8px}
td{border-bottom:1px solid #eef1f4;padding:7px 8px;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:#f5f9fd}
.chip{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px;background:#edf1f5;color:#35424f;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:#1f6e37}.chip.warn{background:var(--warn-soft);color:#8a5400}.chip.bad{background:var(--bad-soft);color:#9b1f1f}.chip.blue{background:var(--accent-soft);color:#0a4f97}
.stages{display:flex;flex-wrap:wrap;gap:2px;margin:6px 0 2px}
.stages span{font-size:12px;padding:3px 10px;background:#e4e9ee;color:#55626f;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,0 100%,7px 50%)}
.stages span.done{background:#9fd3ad;color:#174b27}.stages span.cur{background:#2e9e4f;color:#fff}
.alert{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eef1f4}
.alert:last-child{border-bottom:0}
.code{flex:none;font-weight:700;font-size:12px;width:34px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.code.bad{background:var(--bad-soft);color:var(--bad)}.code.warn{background:var(--warn-soft);color:var(--warn)}.code.ai{background:#efe8fb;color:var(--src-ai)}
.alert .t{font-size:13px}.alert .m{font-size:12px;color:var(--muted)}
.gantt{position:relative;font-size:12px}
.grow{display:grid;grid-template-columns:170px 1fr 60px;gap:8px;align-items:center;padding:4px 0}
.track{position:relative;height:16px;background:#f0f3f6;border-radius:4px}
.bar{position:absolute;top:2px;height:12px;border-radius:3px;background:#b9d5f2}
.bar .f{height:100%;border-radius:3px;background:var(--accent)}
.bar.late{background:#f3c9c9}.bar.late .f{background:var(--bad)}
.bar.risk{background:#ffe1a8}
.today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:#f4f7f9;border-radius:8px;padding:8px;min-height:120px}
.col h3{font-size:12px;margin:0 0 8px;color:var(--muted);display:flex;justify-content:space-between}
.item{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px;margin-bottom:8px;font-size:12px;cursor:pointer}
.item:hover{border-color:#9cc3ec}
.item b{font-size:13px;display:block;margin-bottom:2px}
.item.alarm{border-left:3px solid var(--bad)}
.banner{background:var(--warn-soft);border:1px solid #f0d49b;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.banner.blue{background:var(--accent-soft);border-color:#b8d4f1}
.bars{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#edf1f5;min-width:120px}
.bars i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.ap{display:flex;gap:8px;align-items:center;font-size:12px;padding:3px 0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:#c4ccd4}
.dot.ok{background:var(--ok)}.dot.wait{background:var(--warn)}.dot.no{background:var(--bad)}
.cm{border-left:3px solid var(--line);padding:4px 10px;margin:6px 0;font-size:13px}
.cm.tense{border-color:var(--src-ai);background:#f7f3fd}
.cm small{color:var(--muted);display:block}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,40,.4);display:none;align-items:flex-start;justify-content:center;z-index:20;padding:40px 16px;overflow:auto}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:10px;max-width:720px;width:100%;padding:20px;position:relative}
.x{position:absolute;right:14px;top:10px;font-size:22px;cursor:pointer;color:var(--muted);background:none;border:0}
/* bot */
.bot{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);transform:translateX(105%);transition:transform .2s;z-index:15;display:flex;flex-direction:column}
.bot.open{transform:none}
.bot header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.bot .log{flex:1;overflow:auto;padding:14px 16px;background:#f7f9fb}
.msg{margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:13px;max-width:92%}
.msg.u{background:var(--accent);color:#fff;margin-left:auto}
.msg.b{background:#fff;border:1px solid var(--line)}
.msg.b ul{margin:6px 0;padding-left:18px}
.msg .why{margin-top:6px;font-size:11px;color:var(--muted)}
.bot .chips{padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line)}
.bot .chips button{font:inherit;font-size:12px;border:1px solid #b8d4f1;background:var(--accent-soft);color:#0a4f97;border-radius:14px;padding:4px 10px;cursor:pointer}
.bot form{display:flex;gap:6px;padding:10px 16px 16px}
.bot input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.fab{position:fixed;right:22px;bottom:22px;z-index:14;border-radius:24px;padding:12px 18px;box-shadow:0 6px 18px rgba(11,102,195,.35)}
.foot{color:var(--muted);font-size:12px;padding:0 22px 20px}
.pbar{height:6px;background:#edf1f5;border-radius:3px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--accent)}
.right-n{text-align:right}
@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:6px 0}
  .brand,.nav .grp{display:none}
  .nav{display:flex}
  .nav a{white-space:nowrap;padding:8px 12px}
  .nav a.on{border-left:0;border-bottom:3px solid #4fb3ff;padding-left:12px}
  .g2,.g3{grid-template-columns:1fr}
  .content{padding:16px}
  .top{padding:10px 16px}
  .grow{grid-template-columns:110px 1fr 44px}
  .card{overflow-x:auto}
}
</style>
</head>

/* Нормативы для симптомов (черновые, уточнить с ЭСТ) */
const NORM = {approve:2, counterparty:5, originals:10, depWindow:14};

/* ===================== РАСЧЁТЫ ===================== */
const D = s => new Date(s+'T00:00:00');
function bdays(a,b=TODAY){let d=D(a),e=D(b),n=0;while(d<e){d.setDate(d.getDate()+1);const w=d.getDay();if(w>0&&w<6)n++;}return n;}
function cdays(a,b=TODAY){return Math.round((D(b)-D(a))/864e5);}
const fd = s => s ? s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4) : '-';
const sum = (arr,f=x=>x.sum) => arr.reduce((a,x)=>a+f(x),0);
function money(v){
  const a=Math.abs(v), s=v<0?'−':'';
  if(a>=1e6) return s+(a/1e6).toLocaleString('ru-RU',{maximumFractionDigits:2})+' млн ₽';
  if(a>=1e3) return s+Math.round(a/1e3).toLocaleString('ru-RU')+' тыс. ₽';
  return s+a.toLocaleString('ru-RU')+' ₽';
}
const rub = v => v.toLocaleString('ru-RU')+' ₽';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P = id => PROJECTS.find(p=>p.id===id);
const K = id => KC.find(k=>k.id===id);
const who = w => PEOPLE[w] ? PEOPLE[w].n : w;
const role = w => PEOPLE[w] ? PEOPLE[w].r : '';

function kcCalc(k){
  const dsOn  = sum((k.ds||[]).filter(d=>d.stage==='Действует'));
  const dsPend= sum((k.ds||[]).filter(d=>d.stage!=='Действует'));
  const total = k.sum + dsOn;
  const done  = sum((k.acts||[]).filter(a=>a.st==='Принят'));
  const onAcc = sum((k.acts||[]).filter(a=>a.st!=='Принят'));
  const pays  = PAY.filter(x=>x.k===k.id);
  const paid  = sum(pays.filter(x=>x.stage==='Оплачена'));
  const inPay = sum(pays.filter(x=>!['Оплачена','Отклонена'].includes(x.stage)));
  return {dsOn,dsPend,total,done,onAcc,paid,inPay,debt:Math.max(done-paid,0),adv:Math.max(paid-done,0),left:total-done};
}
function projCalc(pid){
  const p=P(pid), cc=CC.find(c=>c.p===pid)||{sum:0,ds:[],inc:[],acts:[]};
  const ks=KC.filter(k=>k.p===pid);
  let contracted=0,pending=0,paid=0,debt=0,adv=0,done=0;
  ks.forEach(k=>{const c=kcCalc(k); if(k.stage==='Оформление') pending+=k.sum; else {contracted+=c.total; pending+=c.dsPend;} paid+=c.paid; debt+=c.debt; adv+=c.adv; done+=c.done;});
  const cTotal=cc.sum+sum(cc.ds.filter(d=>d.stage==='Действует'));
  const cPend=sum(cc.ds.filter(d=>d.stage!=='Действует'));
  const inc=sum(cc.inc), closed=sum(cc.acts);
  return {cc,ks,contracted,pending,paid,debt,adv,done,cTotal,cPend,inc,closed,
    unclosedAdv:Math.max(inc-closed,0), clientOwes:Math.max(closed-inc,0),
    margin:cTotal-p.budget, freeBudget:p.budget-contracted-pending};
}
function costRows(pid){
  const p=P(pid); const ks=KC.filter(k=>k.p===pid);
  return p.cost.map(r=>{
    const mine=ks.filter(k=>k.art===r.a);
    let con=0,pend=0,paid=0;
    mine.forEach(k=>{const c=kcCalc(k); if(k.stage==='Оформление') pend+=k.sum; else {con+=c.total; pend+=c.dsPend;} paid+=c.paid;});
    return {...r,con,pend,paid,over:con+pend-r.plan,ks:mine};
  });
}

/* Симптомы П1-П6: правила по данным СП (то же должен уметь бот на стенде) */
function alerts(pid){
  const out=[];
  DOCS.filter(d=>d.p===pid).forEach(d=>{
    (d.ap||[]).filter(a=>a.st==='wait').forEach(a=>{
      const n=bdays(a.from);
      if(n>NORM.approve) out.push({c:'П1',lvl:'bad',t:`${d.title}: ${n} р.д. на согласовании, ждём: ${who(a.w)} (${role(a.w)})`,m:`Норматив ${NORM.approve} р.д. Задание БП с ${fd(a.from)}.`,go:['doc',d.id],src:'Оформление документов: задания БП, дата назначения'});
    });
    if(d.stage==='Подписание'&&d.cp){const n=bdays(d.since); if(n>NORM.counterparty) out.push({c:'П1',lvl:'bad',t:`${d.title}: на подписании у контрагента ${n} р.д.`,m:`Норматив ожидания контрагента ${NORM.counterparty} р.д.`,go:['doc',d.id],src:'Оформление документов: стадия, дата входа в стадию'});}
    if(d.stage==='Оригиналы'){const n=bdays(d.since); const k=d.k&&K(d.k); if(n>NORM.originals) out.push({c:'П6',lvl:'warn',t:`${d.title}: ${k&&k.stage==='Закрыт'?'договор закрыт, а ':''}оригиналы ждём ${n} р.д.`,m:`Норматив ${NORM.originals} р.д. (уточнить с ЭСТ).`,go:['doc',d.id],src:'Оформление документов: стадия «Оригиналы» + стадия договора'});}
    if((d.cm||[]).some(c=>c.tense)) out.push({c:'П5',lvl:'ai',t:`${d.title}: напряжённая переписка юриста и РП`,m:'Оценка ИИ по комментариям к элементу.',go:['doc',d.id],src:'ИИ: комментарии к элементу СП'});
  });
  PAY.filter(x=>{const k=K(x.k);return k&&k.p===pid;}).forEach(x=>{
    if(x.task&&cdays(x.task.from)>=1) out.push({c:'П3',lvl:'bad',t:`${x.id} (${K(x.k).c}, ${money(x.sum)}): нет ответа больше суток, ждём: ${who(x.task.w)} (${role(x.task.w)})`,m:`Задание БП с ${fd(x.task.from)} ${x.task.t}.`,go:['pay',x.id],src:'Заявка на оплату: задание БП, дата назначения'});
    if(x.stage==='Отклонена'&&!x.reason) out.push({c:'П2',lvl:'warn',t:`${x.id} (${K(x.k).c}) отклонена без причины`,m:`Отклонена ${fd(x.closed)}; долг по акту остаётся.`,go:['pay',x.id],src:'Заявка на оплату: стадия + поле «Причина отклонения»'});
  });
  const p=P(pid);
  if(p.object.passport<100){const n=cdays(TODAY,p.start); out.push({c:'П4',lvl:'bad',t:`Паспорт объекта ${p.object.id} заполнен на ${p.object.passport}%, а старт проекта ${fd(p.start)} (через ${n} дн.)`,m:'Пока паспорт не заполнен, проект не перейдёт дальше «Заключения договора».',go:['summary',p.id],src:'Объект: заполненность паспорта + Проект: дата старта'});}
  p.sched.forEach(s=>{ if(s.dep){const k=K(s.dep); const n=cdays(TODAY,s.ps); if(k&&k.stage==='Оформление'&&n>=0&&n<=NORM.depWindow) out.push({c:'П4',lvl:'bad',t:`Этап «${s.n}» начинается ${fd(s.ps)} (через ${n} дн.), а договор ${k.id} ещё не подписан`,m:`${k.c}, стадия договора «${k.stage}».`,go:['kc',k.id],src:'Этап проекта: дата начала + Договор с контрагентом: стадия'});}});
  costRows(pid).forEach(r=>{ if(r.over>0) out.push({c:'₽',lvl:'warn',t:`Статья «${r.a}»: законтрактовано и в оформлении ${money(r.con+r.pend)} при плане ${money(r.plan)}`,m:`Превышение ${money(r.over)}.`,go:['cost'],src:'Расчёт: договоры с контрагентами по статье против плана себестоимости'});});
  return out;
}
function myTasks(){
  const out=[];
  DOCS.forEach(d=>(d.ap||[]).forEach(a=>{if(a.w===ME&&a.st==='wait') out.push({t:`Согласовать: ${d.title}`,p:d.p,from:a.from,go:['doc',d.id]});}));
  return out;
}

const TRACE = new Map();
const SRC = {sp:'СП',c1:'1С',calc:'Расчёт',ai:'ИИ'};
function src(t,e,f){return {t,e,f};}
function srcHtml(s){return s?`<div class="src"><span class="st ${s.t}">${SRC[s.t]}</span>${esc(s.e)}${s.f?': '+esc(s.f):''}</div>`:'';}
function kpi(scr,label,val,s,sub,cls=''){
  if(s) TRACE.set(scr+'|'+label,{scr,label,...s});
  return `<div class="kpi ${cls}"><div class="l">${esc(label)}</div><div class="v">${val}</div>${sub?`<div class="s">${sub}</div>`:''}${srcHtml(s)}</div>`;
}
function reg(scr,label,s){TRACE.set(scr+'|'+label,{scr,label,...s}); return srcHtml(s);}

function chipFor(st){
  if(['Действует','Оплачена','Готов','Принят','Закрыт'].includes(st)) return 'ok';
  if(['Отклонена'].includes(st)) return 'bad';
  if(['Оформление','Согласование','Подписание','Оригиналы','Согласование руководителем','Согласование ФЭС','На приёмке ПТО'].includes(st)) return 'warn';
  return 'blue';
}

function go(...a){location.hash='#'+a.map(encodeURIComponent).join('/');}
function link(a,text){return `<a onclick='go(${a.map(x=>JSON.stringify(x)).join(',')})'>${esc(text)}</a>`;}
function alertHtml(a){return `<div class="alert"><div class="code ${a.lvl}">${a.c}</div><div><div class="t">${link(a.go,a.t)}</div><div class="m">${esc(a.m)}</div>${srcHtml({t:a.src.startsWith('ИИ')?'ai':a.src.startsWith('Расчёт')?'calc':'sp',e:a.src.replace(/^(ИИ|Расчёт): /,'')})}</div></div>`;}

 {g:'Проекты'},

 {id:'trace',t:'Откуда данные'}
];
function renderNav(cur){
  $('nav').innerHTML=NAV.map(n=>n.g?`<div class="grp">${n.g}</div>`:`<a class="${n.id===cur?'on':''}" onclick="go('${n.id}')"><span>${n.t}</span>${n.tag?`<span class="tag">${n.tag}</span>`:''}</a>`).join('');
}

/* ---- Мой проект ---- */
function gantt(p){
  const a=D(p.start), b=D(p.end), span=(b-a)||1, pos=s=>Math.max(0,Math.min(100,(D(s)-a)/span*100));
  const t=pos(TODAY);
  return `<div class="gantt">${p.sched.map(s=>{
    const late=s.fe&&s.fe>s.pe, k=s.dep&&K(s.dep), risk=k&&k.stage==='Оформление';
    const L=pos(s.ps), R=pos(s.fe&&s.fe>s.pe?s.fe:s.pe);
    return `<div class="grow"><div>${esc(s.n)}${risk?` <span class="chip bad">нет договора</span>`:''}</div>
      <div class="track"><div class="bar ${late?'late':risk?'risk':''}" style="left:${L}%;width:${Math.max(R-L,1.5)}%"><div class="f" style="width:${s.pct}%"></div></div>${t>0&&t<100?`<div class="today" style="left:${t}%"></div>`:''}</div>
      <div class="right-n">${s.pct}%</div></div>`;}).join('')}
  </div><div class="legend"><span><i style="background:var(--accent)"></i>выполнено</span><span><i style="background:#f3c9c9"></i>с отставанием</span><span><i style="background:#ffe1a8"></i>под риском</span><span><i style="background:var(--bad)"></i>сегодня</span></div>`;
}

   <div class="card"><h2>Смета договора с учётом ДС</h2>${k.est?`<table><tr><th>Позиция</th><th>Ед.</th><th class="n">Кол-во</th><th class="n">Цена</th><th class="n">Сумма</th></tr>${k.est.map(e=>{const ds=e.ds&&(k.ds||[]).find(x=>x.n.startsWith(e.ds));return `<tr><td>${esc(e.n)}${ds?' '+chip(ds.stage==='Действует'?'ДС действует':'ДС на согласовании'):''}</td><td>${e.u}</td><td class="n">${e.q.toLocaleString('ru-RU')}</td><td class="n">${rub(e.pr)}</td><td class="n">${rub(e.q*e.pr)}</td></tr>`;}).join('')}<tr><td colspan="4"><b>Итого по смете</b></td><td class="n"><b>${rub(estTotal)}</b></td></tr></table>`:`<div class="who">Смета загружается из Excel при оформлении договора. В демо-данных для этого договора не заполнена.</div>`}
     ${reg(S,'Смета договора',src('sp','Позиции сметы договора','импорт согласованной сметы из Excel (нужен образец)'))}</div>
   <div class="card"><h2>Акты</h2>${(k.acts||[]).length?`<table>${k.acts.map(a=>`<tr><td>${esc(a.n)}<br><span class="who">${fd(a.d)}</span></td><td class="n">${rub(a.sum)}</td><td>${chip(a.st)}</td></tr>`).join('')}</table>`:'<div class="who">Актов нет</div>'}
     <h2 style="margin-top:14px">Документы</h2>${docs.length?docs.map(d=>`<div class="ap">${link(['doc',d.id],d.title)} ${chip(d.stage)}</div>`).join(''):'<div class="who">-</div>'}</div>
  </div>
  <div class="card"><h2>Заявки на оплату</h2>${pays.length?`<table><tr><th>Заявка</th><th>Назначение</th><th class="n">Сумма</th><th>Стадия</th><th>1С</th></tr>${pays.map(x=>`<tr class="click" onclick="go('pay','${x.id}')"><td>${x.id}</td><td>${esc(x.w)}</td><td class="n">${rub(x.sum)}</td><td>${chip(x.stage)}</td><td>${esc(x.c1)}</td></tr>`).join('')}</table>`:'<div class="who">Заявок нет</div>'}</div>
  <button class="btn ghost" onclick="botAsk('Что с подрядчиком ${esc(k.c).replace(/'/g,'')}')">Спросить ИИ-помощника об этом подрядчике</button>`;
}

/* ---- Витрина: себестоимость ---- */
function vCost(){
  const p=P(state.pid), S='Себестоимость и риски', rows=costRows(p.id), c=projCalc(p.id);
  const mx=Math.max(...rows.map(r=>Math.max(r.plan,r.con+r.pend)),1);
  return `<h1>Себестоимость и риски</h1><div class="sub">${esc(p.name)}</div>
  <div class="banner"><b>Витрина.</b> Показывает направление. Сейчас план себестоимости живёт в Excel в Nextcloud; здесь он условный. Законтрактовано и оплачено - уже из СП и 1С. Полная модель (смета, риски, «стоимость компании») - v2, после образцов Excel.</div>
  <div class="card"><div class="kpis">
   ${kpi(S,'Договор с клиентом',money(c.cTotal),src('sp','Договор с клиентом','сумма + ДС'))}
   ${kpi(S,'План себестоимости',money(p.budget),src('sp','Проект: план по статьям','импорт из Excel (v2)'))}
   ${kpi(S,'Маржа по плану',money(c.margin),src('calc','Договор с клиентом − план себестоимости'),`${Math.round(c.margin/c.cTotal*100)}%`)}
   ${kpi(S,'Не законтрактовано',money(Math.max(c.freeBudget,0)),src('calc','План − законтрактовано − в оформлении'))}
  </div></div>
  <div class="card"><h2>По статьям</h2><div class="legend"><span><i style="background:var(--accent)"></i>законтрактовано</span><span><i style="background:#9cc3ec"></i>в оформлении</span><span><i style="background:var(--bad)"></i>сверх плана</span><span>| - план</span></div>
  <table><tr><th>Статья</th><th class="n">План</th><th class="n">Законтр.</th><th class="n">В оформл.</th><th class="n">Оплачено</th><th style="min-width:180px"></th></tr>
  ${rows.map(r=>{const w=x=>x/mx*100, con=Math.min(r.con,r.plan), pend=Math.max(Math.min(r.con+r.pend,r.plan)-r.con,0), over=Math.max(r.over,0);
   return `<tr><td>${esc(r.a)}${r.over>0?' <span class="chip bad">перерасход</span>':''}${r.con+r.pend===0&&!['Материалы ЭСТ','Накладные и прочее'].includes(r.a)?' <span class="chip warn">нет договора</span>':''}</td><td class="n">${money(r.plan)}</td><td class="n">${r.con?money(r.con):'-'}</td><td class="n">${r.pend?money(r.pend):'-'}</td><td class="n">${r.paid?money(r.paid):'-'}</td>
   <td><div style="position:relative;height:12px;background:#f0f3f6;border-radius:3px"><div style="position:absolute;left:0;height:12px;width:${w(con)}%;background:var(--accent);border-radius:3px 0 0 3px"></div><div style="position:absolute;left:${w(con)}%;height:12px;width:${w(pend)}%;background:#9cc3ec"></div><div style="position:absolute;left:${w(r.plan)}%;height:12px;width:${w(over)}%;background:var(--bad)"></div><div style="position:absolute;left:${w(r.plan)}%;top:-3px;height:18px;width:2px;background:#1f2933"></div></div></td></tr>`;}).join('')}</table>
  ${reg(S,'Статьи себестоимости',src('calc','План по статьям (Excel, v2) против договоров с контрагентами по полю «Статья»'))}</div>
  <div class="card"><h2>Риски</h2>${alerts(p.id).filter(a=>a.c==='₽'||a.c==='П4').map(alertHtml).join('')||'<div class="who">Нет</div>'}</div>`;
}

/* ---- Витрина: объёмы ---- */
function vVol(){
  const p=P(state.pid), S='Объёмы и приёмка';
  return `<h1>Объёмы и приёмка</h1><div class="sub">${esc(p.name)}</div>
  <div class="banner"><b>Витрина.</b> Путь объёма: позиция ВОР заказчика → виды работ ЭСТ → отчёт субподрядчика → приёмка ПТО → закрытие заказчику. Сейчас каждый шаг - отдельный Excel. Модель сметы и ВОР - v2, после образцов файлов.</div>
  ${p.vol.length?`<div class="card"><table><tr><th>Позиция ВОР заказчика</th><th>Виды работ ЭСТ</th><th>Подрядчик</th><th class="n">По смете</th><th class="n">Отчёт подрядчика</th><th class="n">Принято ПТО</th><th class="n">Закрыто заказчику</th></tr>
  ${p.vol.map(v=>`<tr><td><b>${esc(v.pos)}</b>, ${v.u}</td><td>${v.works.map(esc).join('<br>')}</td><td>${link(['kc',v.k],K(v.k).c)}</td><td class="n">${v.q}</td><td class="n">${v.rep}</td><td class="n">${v.acc}${v.acc<v.rep?`<br><span class="chip warn">−${v.rep-v.acc} ждут приёмки</span>`:''}</td><td class="n">${v.cl}${v.cl<v.acc?`<br><span class="chip blue">${v.acc-v.cl} можно закрыть</span>`:''}</td></tr>`).join('')}</table>
  ${reg(S,'Позиция ВОР заказчика',src('sp','ВОР заказчика','импорт сметы заказчика (v2)'))}${reg(S,'Отчёт подрядчика',src('sp','Отчёт о выполнении','подрядчик отчитывается по согласованной смете (v2)'))}${reg(S,'Принято ПТО',src('sp','Приёмка ПТО','задание БП инженеру ПТО (v2)'))}</div>
  <div class="card"><h2>Что это даёт РП</h2><ul><li>Объём, который можно предъявить заказчику, виден сразу, без сводной таблицы.</li><li>Расхождение «подрядчик отчитался - ПТО не принял» видно по каждой позиции.</li><li>Связка позиции заказчика с видами работ ЭСТ хранится, поэтому закрытие идёт в наименованиях заказчика.</li></ul></div>`:'<div class="card who">Для этого проекта демо-данных по объёмам нет.</div>'}`;
}

/* ---- Откуда данные ---- */
function vTrace(){
  /* прогоняем все экраны, чтобы собрать реестр */
  const keep=state.pid; PROJECTS.forEach(p=>{state.pid=p.id;vSummary();vDocs();vPay();vKcs();vCost();vVol();}); vProjects(); KC.forEach(k=>vKc(k.id)); state.pid=keep;
  const rows=[...TRACE.values()]; const order=['Мои проекты','Мой проект','Договоры и документы','Заявки на оплату','Контрагенты на объекте','Карточка контрагента на объекте','Заявка на оплату','Себестоимость и риски','Объёмы и приёмка'];
  rows.sort((a,b)=>order.indexOf(a.scr)-order.indexOf(b.scr));
  const cnt=t=>rows.filter(r=>r.t===t).length;
  return `<h1>Откуда данные</h1><div class="sub">Каждый показатель прототипа и его источник. Отсюда - список полей, которые обязаны быть в смарт-процессах.</div>
  <div class="card"><div class="kpis">${Object.keys(SRC).map(t=>`<div class="kpi"><div class="l"><span class="st ${t}">${SRC[t]}</span></div><div class="v">${cnt(t)}</div></div>`).join('')}</div></div>
  <div class="card"><table><tr><th>Экран</th><th>Показатель</th><th>Источник</th><th>Сущность и поле</th></tr>
  ${rows.map(r=>`<tr><td>${esc(r.scr)}</td><td>${esc(r.label)}</td><td><span class="st ${r.t}">${SRC[r.t]}</span></td><td>${esc(r.e)}${r.f?': '+esc(r.f):''}</td></tr>`).join('')}</table></div>`;
}

/* ===================== ИИ-ПОМОЩНИК (шаблоны по демо-данным) ===================== */
function botAnswer(q){
  const p=P(state.pid), c=projCalc(p.id), al=alerts(p.id), ql=q.toLowerCase();
  const kc=KC.filter(k=>k.p===p.id).find(k=>ql.includes(k.c.replace(/ООО |«|»/g,'').toLowerCase().split(' ')[0]));
  if(kc){const x=kcCalc(kc), a=alerts(p.id).filter(z=>z.t.includes(kc.id)||z.t.includes(kc.c));
    return {h:`<b>${esc(kc.c)}</b>, договор ${esc(kc.id)} (${esc(kc.stage.toLowerCase())}).<ul><li>Сумма с ДС ${money(x.total)}${x.dsPend?`, ещё ${money(x.dsPend)} ДС на согласовании`:''}.</li><li>Принято ${money(x.done)}${x.onAcc?`, на приёмке ПТО ${money(x.onAcc)}`:''}; оплачено ${money(x.paid)}.</li><li>${x.debt?`Долг ЭСТ перед подрядчиком <b>${money(x.debt)}</b>.`:x.adv?`Аванс не закрыт работами: ${money(x.adv)}.`:'Взаиморасчёты закрыты.'}</li>${a.map(z=>`<li>${z.c}: ${esc(z.t)}</li>`).join('')}</ul>`,
      why:'Договор с контрагентом, акты, заявки на оплату (статусы 1С), задания БП'};}
  if(/сводк|кратко|как дела|состояни/.test(ql)){
    const late=p.sched.filter(s=>s.fe&&s.fe>s.pe), cur=p.sched.find(s=>s.pct>0&&s.pct<100);
    return {h:`<b>${esc(p.name)}</b>, стадия «${esc(p.stage)}».<ul>
      <li>Сроки: ${cur?`идёт «${esc(cur.n)}», ${cur.pct}%`:'активных этапов нет'}${late.length?`; с отставанием закрыт этап «${esc(late[0].n)}»`:''}. Сдача по плану ${fd(p.end)}.</li>
      <li>Клиент: договор ${money(c.cTotal)}, получено ${money(c.inc)}, закрыто актами ${money(c.closed)}${c.unclosedAdv?`; незакрытый аванс ${money(c.unclosedAdv)}`:''}${c.cc.retention?`; гарантийное удержание ${money(c.clientOwes)} до ${fd(c.cc.retentionDue)}`:''}.</li>
      <li>Подрядчики: законтрактовано ${money(c.contracted)} из плана ${money(p.budget)}${c.pending?`, в оформлении ещё ${money(c.pending)}`:''}; долг перед подрядчиками ${money(c.debt)}.</li></ul>
      ${al.length?`Главное, на что смотреть (${al.length}):<ul>${al.slice(0,4).map(z=>`<li>${z.c}: ${esc(z.t)}</li>`).join('')}</ul>`:'Тревог нет.'}`,
      why:'Проект, Этапы проекта, Договоры (СП), поступления и оплаты (1С), задания БП'};}
  if(/узк|тревог|горит|риск|проблем|застр/.test(ql)){
    return {h:al.length?`Нашёл ${al.length}:<ul>${al.map(z=>`<li><b>${z.c}</b> ${esc(z.t)}; ${esc(z.m.charAt(0).toLowerCase()+z.m.slice(1))}</li>`).join('')}</ul>`:'Узких мест не вижу.',why:'Правила П1-П6 по стадиям, датам и заданиям БП; П5 - оценка тона комментариев'};}
  if(/сегодня|мне сделать|ждут|мои задан/.test(ql)){
    const m=myTasks();
    return {h:m.length?`Ждут вашего решения:<ul>${m.map(z=>`<li>${esc(z.t)} (${esc(P(z.p).name)}, с ${fd(z.from)})</li>`).join('')}</ul>${al.filter(z=>z.lvl==='bad').length?`И стоит напомнить коллегам по ${al.filter(z=>z.lvl==='bad').length} пунктам из тревог.`:''}`:'Ваших заданий нет.',why:'Задания БП, где исполнитель - вы'};}
  if(/долг|должн|оплат|деньг/.test(ql)){
    const ks=KC.filter(k=>k.p===p.id).map(k=>({k,x:kcCalc(k)})).filter(z=>z.x.debt);
    return {h:!c.debt?`Долгов перед подрядчиками нет. Клиент: получено ${money(c.inc)}, закрыто актами ${money(c.closed)}${c.cc.retention?`, гарантийное удержание ${money(c.clientOwes)} ожидаем ${fd(c.cc.retentionDue)}`:''}.`:`Долг ЭСТ перед подрядчиками ${money(c.debt)}:<ul>${ks.map(z=>`<li>${esc(z.k.c)}: ${money(z.x.debt)}${PAY.filter(y=>y.k===z.k.id&&!['Оплачена'].includes(y.stage)).map(y=>` - заявка ${y.id} «${esc(y.stage)}»`).join('')}</li>`).join('')}</ul>Клиент: получено ${money(c.inc)}, закрыто актами ${money(c.closed)}.`,why:'Акты (СП) против оплат (1С)'};}
  return {h:'В прототипе я отвечаю по шаблонам на вопросы из подсказок и о подрядчиках по названию. На демо-стенде этот вопрос уйдёт в языковую модель вместе с данными проекта из СП.',why:'Прототип'};
}
const CHIPS=['Сводка по проекту','Где узкие места?','Что мне сделать сегодня?','Кому мы должны?','Что с подрядчиком ЭлектроСтрой?'];
function botAsk(q){
  openBot();
  const a=botAnswer(q);
  $('log').insertAdjacentHTML('beforeend',`<div class="msg u">${esc(q)}</div><div class="msg b">${a.h}<div class="why">Источник: ${esc(a.why)}</div></div>`);
  $('log').scrollTop=1e9;
}
function openBot(){ $('bot').classList.add('open'); $('fab').style.display='none'; $('botCtx').textContent=P(state.pid).name; }
function closeBot(){ $('bot').classList.remove('open'); $('fab').style.display=''; }

/* ===================== РОУТЕР ===================== */
function route(){
  const parts=location.hash.slice(1).split('/').map(decodeURIComponent).filter(Boolean);
  let [v,id]=parts; v=v||'summary';
  if(v==='summary'&&id&&P(id)) state.pid=id;
  let html, nav=v;
  if(v==='doc'){const d=DOCS.find(x=>x.id===id); if(d){state.pid=d.p; html=vDocs(); nav='docs'; openModal(docModal(id));}}
  else if(v==='pay'&&id){const x=PAY.find(y=>y.id===id); if(x){state.pid=K(x.k).p; html=vPay(); openModal(payModal(id));}}
  else if(v==='kc'){html=vKc(id); nav='kcs';}
  if(!html){ closeModal(); html=({projects:vProjects,summary:vSummary,docs:vDocs,pay:vPay,kcs:vKcs,cost:vCost,vol:vVol,trace:vTrace}[v]||vSummary)(); }
  $('view').innerHTML=html; renderNav(nav); $('psel').value=state.pid; $('botCtx').textContent=P(state.pid).name;
  if(!['doc','pay'].includes(v)||!id) window.scrollTo(0,0);
}
function openModal(h){ $('mBody').innerHTML=h; $('modal').classList.add('open'); }
function closeModal(){ $('modal').classList.remove('open'); }

function init(){
  $('psel').innerHTML=PROJECTS.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  $('psel').onchange=e=>{
    state.pid=e.target.value;
    const v=decodeURIComponent(location.hash.slice(1).split('/')[0]||'summary');
    if(['summary','doc','pay','kc'].includes(v)) go('summary',state.pid); else route();
  };
  $('who').textContent=PEOPLE[ME].n;
  $('trC').onchange=e=>{document.body.classList.toggle('trace',e.target.checked); $('trT').classList.toggle('on',e.target.checked);};
  $('fab').onclick=$('botTop').onclick=()=>{ if(!$('log').children.length) $('log').innerHTML=`<div class="msg b">Я вижу данные смарт-процессов по вашим проектам: стадии, сроки, суммы, задания БП и комментарии. Спросите о проекте или выберите подсказку.<div class="why">В прототипе ответы собраны по шаблонам из демо-данных; на стенде - языковая модель.</div></div>`; openBot(); };
  $('botX').onclick=closeBot;
  $('chips').innerHTML=CHIPS.map(c=>`<button type="button">${c}</button>`).join('');
  $('chips').onclick=e=>{ if(e.target.tagName==='BUTTON') botAsk(e.target.textContent); };
  $('botF').onsubmit=e=>{e.preventDefault(); const q=$('botQ').value.trim(); if(q){botAsk(q); $('botQ').value='';}};
  $('mX').onclick=()=>{ closeModal(); history.back(); };
  $('modal').onclick=e=>{ if(e.target.id==='modal'){ closeModal(); history.back(); } };
  window.onhashchange=route;
  route();
}
if(typeof window!=='undefined' && document.getElementById('view')) init();
</script>
</body>
</html>
