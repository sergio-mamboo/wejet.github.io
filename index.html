<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Битрикс24 · Отчёты по сделкам</title>
<style>
  :root{
    --sidebar:#1f2a3a;
    --sidebar-hover:#2a3a52;
    --sidebar-active:#1e88e5;
    --sidebar-text:#aeb9c9;
    --sidebar-text-active:#ffffff;
    --topbar:#ffffff;
    --line:#e3e8ef;
    --accent:#1e88e5;
    --accent-soft:#e3f0fc;
    --ink:#1b1e1a;
    --muted:#6d7268;
    --sans:"Segoe UI","Helvetica Neue",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:#f2f4f7;overflow:hidden}

  .app{display:flex;height:100vh}

  /* ---------- Left sidebar ---------- */
  .sidebar{
    width:240px;min-width:240px;background:var(--sidebar);
    display:flex;flex-direction:column;color:var(--sidebar-text);
  }
  .logo{
    display:flex;align-items:center;gap:10px;padding:16px 18px;
    color:#fff;font-weight:700;font-size:15px;letter-spacing:.01em;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .logo .mark{
    width:26px;height:26px;border-radius:7px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;
  }
  .side-menu{flex:1;padding:10px 8px;overflow-y:auto}
  .side-item{
    display:flex;align-items:center;gap:12px;padding:10px 12px;margin:2px 0;
    border-radius:8px;color:var(--sidebar-text);font-size:13.5px;text-decoration:none;
    transition:background .15s,color .15s;
  }
  .side-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
  .side-item:hover{background:var(--sidebar-hover);color:#fff}
  .side-item.active{background:var(--sidebar-active);color:var(--sidebar-text-active);font-weight:600}
  .side-item.disabled{opacity:.55;cursor:default}
  .side-item.disabled:hover{background:transparent;color:var(--sidebar-text)}
  .side-sep{height:1px;background:rgba(255,255,255,.08);margin:10px 12px}
  .side-foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--sidebar-text)}

  /* ---------- Main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{
    height:56px;background:var(--topbar);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;
  }
  .topbar .crumb{font-size:14px;color:var(--muted)}
  .topbar .crumb b{color:var(--ink);font-weight:600}
  .topbar .user{display:flex;align-items:center;gap:10px}
  .avatar{
    width:32px;height:32px;border-radius:50%;background:var(--accent);
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
  }
  .bell{width:18px;height:18px;color:var(--muted);cursor:pointer}

  /* ---------- Section menu (horizontal tabs) ---------- */
  .section-menu{
    display:flex;align-items:center;gap:4px;background:var(--topbar);
    border-bottom:1px solid var(--line);padding:0 16px;flex-shrink:0;
  }
  .tab{
    position:relative;padding:14px 18px;background:none;border:none;cursor:pointer;
    font-family:var(--sans);font-size:13.5px;color:var(--muted);font-weight:500;
    transition:color .15s;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--accent);font-weight:600}
  .tab.active::after{
    content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;
    background:var(--accent);border-radius:3px 3px 0 0;
  }

  /* ---------- Content ---------- */
  .content{flex:1;position:relative;background:#f2f4f7}
  .frame{
    width:100%;height:100%;border:none;display:none;background:#f2efe7;
  }
  .frame.active{display:block}
</style>
</head>
<body>
  <div class="app">
    <!-- Left sidebar -->
    <aside class="sidebar">
      <div class="logo"><span class="mark">Б</span>Битрикс24</div>
      <nav class="side-menu">
        <a class="side-item disabled" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
          Рабочий стол
        </a>
        <a class="side-item disabled" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Задачи
        </a>
        <a class="side-item disabled" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 21V9"/></svg>
          CRM
        </a>
        <a class="side-item disabled" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
          Чаты и звонки
        </a>
        <a class="side-item disabled" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Календарь
        </a>
        <a class="side-item disabled" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Диск
        </a>
        <div class="side-sep"></div>
        <a class="side-item active" href="#reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
          Отчёты
        </a>
        <a class="side-item disabled" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Настройки
        </a>
      </nav>
      <div class="side-foot">Сергей Смирнов</div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="crumb">Рабочее пространство · <b>Отчёты по сделкам</b></div>
        <div class="user">
          <svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <div class="avatar">СС</div>
        </div>
      </header>

      <nav class="section-menu" id="tabs">
        <button class="tab active" data-key="weekly">Недельный</button>
        <button class="tab" data-key="monthly">Месячный / Квартальный</button>
        <button class="tab" data-key="rop">РОП · план-факт</button>
      </nav>

      <div class="content">
        <iframe class="frame active" data-key="weekly" src="weekly-report-prototype.html" title="Недельный отчёт"></iframe>
        <iframe class="frame" data-key="monthly" data-src="monthly-quarterly-report-prototype.html" title="Месячный / Квартальный отчёт"></iframe>
        <iframe class="frame" data-key="rop" data-src="rop-report-prototype.html" title="Отчёт для РОПа"></iframe>
      </div>
    </main>
  </div>

<script>
  const tabs = document.querySelectorAll('#tabs .tab');
  const frames = document.querySelectorAll('.frame');
  // последовательная предзагрузка неактивных отчётов (избегаем конкуренции при cold start)
  window.addEventListener('load', ()=>{
    const monthly = document.querySelector('.frame[data-key="monthly"]');
    const rop = document.querySelector('.frame[data-key="rop"]');
    setTimeout(()=>{ if(!monthly.getAttribute('src')) monthly.src = monthly.dataset.src; }, 500);
    setTimeout(()=>{ if(!rop.getAttribute('src')) rop.src = rop.dataset.src; }, 1000);
  });
  tabs.forEach(tab=>{
    tab.addEventListener('click',()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const key = tab.dataset.key;
      frames.forEach(f=>{
        const isActive = f.dataset.key===key;
        f.classList.toggle('active', isActive);
        if(isActive && !f.getAttribute('src')){
          f.src = f.dataset.src;
        }
      });
    });
  });
</script>
</body>
</html>
