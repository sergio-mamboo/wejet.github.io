<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отчёт для РКС · План-факт по предприятиям — прототип</title>
<style>
  :root{
    --bg:#f2efe7;
    --surface:#ffffff;
    --surface-2:#faf8f2;
    --ink:#1b1e1a;
    --ink-soft:#3c403a;
    --muted:#6d7268;
    --faint:#9aa096;
    --line:#e3ddd0;
    --line-strong:#cfc7b6;
    --accent:#0e7a58;
    --accent-deep:#0a5c42;
    --accent-soft:#e2efe8;
    --accent-ink:#0a5c42;
    --warn:#b95a1f;
    --bad:#b3261e;
    --mono:"Cascadia Mono","Consolas","SF Mono",ui-monospace,monospace;
    --sans:"Segoe UI","Helvetica Neue",system-ui,sans-serif;
    --shadow:0 1px 2px rgba(27,30,26,.05),0 8px 24px rgba(27,30,26,.06);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--sans);color:var(--ink);
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(14,122,88,.08), transparent 60%),
      radial-gradient(900px 400px at -10% 0%, rgba(185,90,31,.06), transparent 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    padding:28px clamp(16px,4vw,56px) 60px;
  }

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;margin-bottom:8px}
  h1{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .subtitle{color:var(--muted);font-size:14px;margin-top:8px}
  .scope{text-align:right;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow)}
  .scope b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink);margin-top:2px}
  .scope .lbl{letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:var(--faint)}

  .controls{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;margin-bottom:20px;
    display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
  }
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .field select{
    font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--surface-2);
    border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;outline:none;cursor:pointer;
    transition:border-color .15s,box-shadow .15s;
  }
  .field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:7px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:9px}
  .chip{font-size:12.5px;padding:5px 10px;border-radius:999px;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);user-select:none;transition:all .15s}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chip.off{opacity:.45}

  .matrix-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .matrix-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .matrix-head h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .matrix-head .hint{font-size:12px;color:var(--faint)}
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:900px}
  th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--line)}
  th{
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    font-weight:700;background:var(--surface-2);white-space:nowrap;vertical-align:bottom;
  }
  th .src{display:block;font-weight:400;text-transform:none;letter-spacing:0;font-size:10px;color:var(--faint);margin-top:3px;line-height:1.3}
  th.rowhead,td.rowhead{text-align:left}
  td.rowhead{font-weight:600;font-size:13.5px;color:var(--ink-soft);white-space:nowrap}
  td.money{font-family:var(--mono);font-size:13.5px;font-weight:600}
  td.pct{font-family:var(--mono);font-size:13.5px;font-weight:700}
  tr.emprow td{background:var(--accent-soft);font-family:var(--mono);font-weight:700;color:var(--accent-ink)}
  tr.emprow td.rowhead{color:var(--accent-ink)}
  tr.emprow td .emp{display:block;font-weight:800;color:var(--accent-ink)}
  tr.grand td{background:var(--ink);color:#fff;font-family:var(--mono);font-weight:700;border-bottom:none}
  tr.grand td.rowhead{color:#fff}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:opacity .2s,transform .2s}
  .empty{padding:40px;text-align:center;color:var(--faint);font-size:14px}

  .foot{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint)}
  .foot .demo{color:var(--warn);font-weight:600;letter-spacing:.04em}

  @media (max-width:640px){.scope{text-align:left}.topbar{align-items:flex-start}}
</style>
</head>
<body>

  <header class="topbar">
    <div>
      <div class="eyebrow">Аналитические отчёты · Сделки</div>
      <h1>Отчёт для руководителя коммерческой службы</h1>
      <div class="subtitle">План-факт по предприятиям · моментальный срез · валюта RUB</div>
    </div>
    <div class="scope">
      <span class="lbl">Отчётный год</span>
      <b id="scopeYear">—</b>
    </div>
  </header>

  <section class="controls">
    <div class="field">
      <label for="year">Отчётный год</label>
      <select id="year"></select>
    </div>
    <div class="field">
      <label>Сотрудники</label>
      <div class="chips" id="emps"></div>
    </div>
  </section>

  <section class="matrix-wrap">
    <div class="matrix-head">
      <h2>План-факт по предприятиям</h2>
      <span class="hint">ФПС и бюджет — из СП «Планируемые бюджеты» · заключено — срез на сейчас</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="foot">
      <span>Прототип интерфейса · <span class="demo">демо-данные</span></span>
      <span id="footNote"></span>
    </div>
  </section>

<script>
  // ---------- Демо-данные (детерминированная генерация) ----------
  const EMPLOYEES = ["Анна Соколова","Дмитрий Ковалёв","Мария Лебедева"];
  const YEARS = ["2026","2025","2024"];

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

  // data[emp][year] = [{p, f, b, z}, ...]; предприятия фиксированы у сотрудника, суммы зависят от года
  const data = {};
  EMPLOYEES.forEach((emp,ei)=>{
    data[emp]={};
    const rnd0=mulberry32(hashStr(emp+"funnels"));
    const n=5+Math.floor(rnd0()*3);
    const names=[];
    for(let i=0;i<n;i++){names.push(`Предприятие ${ei*10+i+1}`);}
    YEARS.forEach(yr=>{
      const rnd=mulberry32(hashStr(emp+yr));
      data[emp][yr]=names.map(name=>{
        const f=Math.round((10000000+rnd()*90000000)/100000)*100000;
        const b=Math.round(f*(0.2+rnd()*0.7));
        const z=Math.round(b*(0.05+rnd()*0.9));
        return {p:name,f,b,z};
      });
    });
  });

  const state = { year:YEARS[0], emps:new Set(EMPLOYEES) };

  const $year=document.getElementById("year");
  const $emps=document.getElementById("emps");
  const $thead=document.getElementById("thead");
  const $tbody=document.getElementById("tbody");
  const $scope=document.getElementById("scopeYear");
  const $foot=document.getElementById("footNote");

  const HEADERS = [
    {k:"f", t:"ФПС", src:"форма предварительного согласования · СП «Планируемые бюджеты»"},
    {k:"b", t:"Планируемый бюджет", src:"СП «Планируемые бюджеты»"},
    {k:"target", t:"Целевой показатель", src:"90% от бюджета"},
    {k:"z", t:"Заключено", src:"сделки, «Договор заключён» = да · срез на сейчас"},
    {k:"pct", t:"% выполнения", src:"Заключено ÷ Целевой показатель"}
  ];

  function fmt(n){return n.toLocaleString("ru-RU");}
  function money(n){return fmt(n)+" ₽";}
  function pct(n){return (n*100).toFixed(1).replace(".",",")+"%";}
  function pctClass(p){if(p>=1)return "color:#0e7a58";if(p>=0.5)return "color:#b95a1f";return "color:#b3261e";}

  function initControls(){
    YEARS.forEach(y=>{const o=document.createElement("option");o.value=y;o.textContent=y;$year.appendChild(o);});
    EMPLOYEES.forEach(e=>{
      const c=document.createElement("span");
      c.className="chip on";c.textContent=e;c.dataset.emp=e;
      c.addEventListener("click",()=>{
        if(state.emps.has(e)){state.emps.delete(e);c.classList.remove("on");c.classList.add("off");}
        else{state.emps.add(e);c.classList.add("on");c.classList.remove("off");}
        render();
      });
      $emps.appendChild(c);
    });
    $year.addEventListener("change",()=>{state.year=$year.value;render();});
  }

  function render(){
    $scope.textContent=state.year;
    const emps=EMPLOYEES.filter(e=>state.emps.has(e));

    $thead.innerHTML=`<tr><th class="rowhead">Сотрудник / Предприятие</th>${HEADERS.map(h=>`<th>${h.t}<span class="src">${h.src}</span></th>`).join("")}</tr>`;

    if(emps.length===0){
      $tbody.innerHTML=`<tr><td colspan="6"><div class="empty">Выберите хотя бы одного сотрудника</div></td></tr>`;
      $foot.textContent=`${state.year} год`;
      return;
    }

    let rows="";
    let grandF=0,grandB=0,grandZ=0;

    emps.forEach(emp=>{
      const items=data[emp][state.year];
      let sF=0,sB=0,sZ=0;
      items.forEach(it=>{sF+=it.f;sB+=it.b;sZ+=it.z;});
      const sTarget=sB*0.9;
      const sP=sZ/sTarget;
      grandF+=sF;grandB+=sB;grandZ+=sZ;
      rows+=`<tr class="emprow"><td class="rowhead"><span class="emp">${emp}</span></td>
        <td class="money">${money(sF)}</td>
        <td class="money">${money(sB)}</td>
        <td class="money">${money(sTarget)}</td>
        <td class="money">${money(sZ)}</td>
        <td class="pct" style="${pctClass(sP)}">${pct(sP)}</td></tr>`;
      items.forEach(it=>{
        const target=it.b*0.9;
        const p=it.z/target;
        rows+=`<tr><td class="rowhead">${it.p}</td>
          <td class="money">${money(it.f)}</td>
          <td class="money">${money(it.b)}</td>
          <td class="money">${money(target)}</td>
          <td class="money">${money(it.z)}</td>
          <td class="pct" style="${pctClass(p)}">${pct(p)}</td></tr>`;
      });
    });

    const gTarget=grandB*0.9;
    const gP=grandZ/gTarget;
    rows+=`<tr class="grand"><td class="rowhead">Итого</td>
      <td>${money(grandF)}</td><td>${money(grandB)}</td><td>${money(gTarget)}</td>
      <td>${money(grandZ)}</td><td>${pct(gP)}</td></tr>`;

    $tbody.innerHTML=rows;
    $foot.textContent=`${emps.join(", ")} · ${state.year} год`;
  }

  initControls();
  render();
</script>
</body>
</html>
